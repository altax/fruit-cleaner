<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    width: 340px;
    margin: 0;
    padding: 24px;
    background: #1c1c1e;
    color: #f2f2f7;
    box-sizing: border-box;
  }
  .title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .title img {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    display: block;
    flex-shrink: 0;
  }
  .title-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .title-name {
    font-size: 18px;
    font-weight: 600;
  }
  .title-desc {
    font-size: 12px;
    color: #8e8e93;
    font-style: italic;
    line-height: 1.3;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: #2c2c2e;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .label-wrap {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .label {
    font-size: 13px;
    font-weight: 400;
    color: #e5e5ea;
    letter-spacing: 0.2px;
  }
    .hint {
    font-size: 12px;
    color: #eb5757;
    font-style: italic;
    opacity: 0.85;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 28px;
    flex-shrink: 0;
    cursor: not-allowed;
    opacity: 0.7;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: not-allowed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #3a3a3c;
    border-radius: 28px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    border-radius: 50%;
  }

  /* ===== Футер с аватаркой ===== */
  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-top: 16px;
    border-top: 1px solid #2c2c2e;
  }
  .footer .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1px solid #3a3a3c;
    background: #2c2c2e;
  }
  .footer .credit {
    font-size: 11px;
    color: #8e8e93;
    line-height: 1.5;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="title">
    <img src="icon128.png" alt="">
    <div class="title-text">
      <span class="title-name">Fruit Cleaner</span>
      <span class="title-desc">блин да где же новости про никса</span>
    </div>
  </div>

  <div class="row">
    <div class="label-wrap">
      <span class="label">Насрать в ленту</span>
      <span class="hint">(нахуя?)</span>
    </div>
    <label class="switch">
      <input type="checkbox" disabled>
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    <img class="avatar" src="avatar.webp" alt="" onerror="this.style.display='none'">
    <div class="credit">
      любезно предоставлено<br>
      настя38леткиберспортсмен
    </div>
  </div>
</body>
</html>
